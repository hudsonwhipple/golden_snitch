seed: 42
device: "mps"

env:
  track: "simple_oval"
  max_episode_steps: 1000
  physics_hz: 240
  policy_hz: 48
  n_envs: 8
  drone_model: "cf2x"
  max_velocity: 5.0
  gate_urdf: "environments/assets/gate.urdf"

reward:
  gate_bonus: 200.0
  collision_penalty: -150.0
  progress_weight: 10.0
  progress_clip: 1.0
  velocity_weight: 0.3
  smooth_weight: 0.05
  time_penalty: -0.01
  max_velocity: 5.0

expert:
  n_episodes: 500
  start_perturbation_pos: 0.5
  start_perturbation_angle: 5.0
  output_dir: "outputs/expert_data"

bc:
  epochs: 50
  batch_size: 512
  lr: 1.0e-3
  lr_schedule: "cosine"
  validation_split: 0.2
  hidden_dims: [256, 256]
  output_dir: "outputs/bc"

ppo:
  total_timesteps: 2500000
  n_steps: 2048
  batch_size: 256
  n_epochs: 10
  learning_rate: 3.0e-4
  lr_schedule: "linear"
  clip_range: 0.2
  gamma: 0.99
  gae_lambda: 0.95
  ent_coef: 0.001
  vf_coef: 0.5
  max_grad_norm: 0.5
  # Off deliberately. SB3 shares one optimizer for actor and critic, and its target_kl
  # check breaks out of the minibatch loop BEFORE optimizer.step(), so early-stopping on
  # policy KL discards the value gradient as well. Starting from BC weights the policy is
  # already expert-level while the value head is random, so KL is high from the first
  # update and the critic gets starved: with target_kl=0.02 explained_variance stayed
  # ~0.00 for 115k steps (against 0.95 by 100k without it), advantages were noise, and
  # ep_rew_mean collapsed 888 -> -70 with a 98% crash rate. The knob is wired if a run
  # ever needs it; the real fix for a BC init is to warm up the critic first.
  target_kl: null
  checkpoint_freq: 250000
  eval_freq: 250000
  eval_episodes: 50
  policy_kwargs:
    net_arch: [256, 256]
    activation_fn: "tanh"
  output_dir: "outputs/ppo"

curriculum:
  # Every level flies the FULL track; difficulty scales on start displacement and
  # observation noise. Progressing on n_gates truncates the episode once N gates are
  # passed, which only ever shows the agent the opening of the track.
  levels:
    - name: "full_track"
      start_perturbation: 0.3
      obs_noise: false
    - name: "full_track_wide_start"
      start_perturbation: 0.8
      obs_noise: false
    - name: "full_track_noise"
      start_perturbation: 0.8
      obs_noise: true
  promotion_threshold: 0.90
  demotion_threshold: 0.60
  # Keep this a multiple of ppo.eval_freq, so a level boundary lands exactly on an
  # evaluation. When it was 500000 against an eval_freq of 250000, only every other
  # eval could promote or demote.
  min_steps_per_level: 250000
  eval_episodes: 50

wandb:
  project: "golden-snitch"
  enabled: true
